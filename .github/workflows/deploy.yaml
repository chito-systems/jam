# On every push to main: build the image, push it to GHCR tagged with the short
# commit SHA, and record that tag on the `deploy` branch. Argo CD watches `deploy`.
#
# Why a branch and not a commit to main (what the starter does): nothing but a
# reviewed PR lands on main. The bot's bookkeeping commit goes to `deploy`, which
# is main plus one line in deploy/kustomization.yaml.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Point the deploy branch at the new image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            if git fetch -q origin deploy 2>/dev/null; then
              git checkout -q -B deploy FETCH_HEAD
              # Bring in main. The only file both sides touch is the kustomization,
              # and its image lines are rewritten just below, so main's copy wins.
              git merge -q --no-edit -X theirs origin/main
            else
              git checkout -q -B deploy origin/main
            fi
            yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
            git add deploy/kustomization.yaml
            git diff --cached --quiet || git commit -q -m "deploy: ${TAG}"
            if git push -q origin deploy; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Couldn't push the deploy branch after 5 tries." >&2
          exit 1
