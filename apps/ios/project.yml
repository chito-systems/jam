name: JAM
options:
  bundleIdPrefix: com.quakeob
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: W9B333RUBX
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JAM:
    type: application
    platform: iOS
    sources: [JAM]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quakeob.jam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: JAM
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk records what you say so you can read it back and send it to your team's brain.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: JAM turns your recording into text on this phone so you can read it before you send it.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: JAM connects to the JAM server running on your team's laptop.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    info:
      path: JAM/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: Paper
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
