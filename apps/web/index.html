<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="JAM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>JAM</title>
  </head>
  <body>
    <script>
      // Set the theme before first paint so dark mode never flashes white.
      (() => {
        let saved = null
        try {
          saved = localStorage.getItem("jam-theme")
        } catch {
          // Storage can be blocked; use the system setting.
        }
        const dark = matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : dark ? "dark" : "light"
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
